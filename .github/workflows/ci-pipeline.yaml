name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Shared workflow policy
    uses: FullHouseDevelopment/CommonWork/.github/workflows/profile-baseline.yml@80340258d8695c41d648d8a67e05df67a2da4972
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      require_concurrency: true
    permissions:
      contents: read

  csharp:
    name: C# validation
    needs: baseline
    uses: FullHouseDevelopment/CommonWork/.github/workflows/profile-dotnet.yml@80340258d8695c41d648d8a67e05df67a2da4972
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      global_json_file: ''
      dotnet_version: '5.0.x'
      restore_command: dotnet restore Assets/Scripts/SpaceGrill.sln
      build_command: dotnet build Assets/Scripts/SpaceGrill.sln --configuration Release --no-restore
      test_command: dotnet test Assets/Scripts/SpaceGrill.sln --configuration Release --no-build --no-restore --verbosity normal
    permissions:
      contents: read

  version-intent:
    name: Version intent
    if: github.event_name == 'pull_request'
    uses: FullHouseDevelopment/CommonWork/.github/workflows/version-intent.yml@80340258d8695c41d648d8a67e05df67a2da4972
    with:
      pr_body: ${{ github.event.pull_request.body }}
      pr_number: ${{ github.event.pull_request.number }}
      head: ${{ github.event.pull_request.head.sha }}
    permissions:
      contents: read
      pull-requests: read
